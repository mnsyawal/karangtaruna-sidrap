<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - Karang Taruna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center justify-content-center" style="min-height: 100vh; background-color: var(--primary);">

    <div class="card card-custom p-4 shadow-lg border-0" style="width: 100%; max-width: 400px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-success"><i class="fa-solid fa-users-rays me-2"></i> Login</h3>
            <p class="text-muted small">Panel Sistem Informasi Karang Taruna</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-muted small fw-bold">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-user"></i></span>
                    <input type="text" id="username" class="form-control" required placeholder="Masukkan username">
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small fw-bold">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light"><i class="fa-solid fa-lock"></i></span>
                    <input type="password" id="password" class="form-control" required placeholder="Masukkan password">
                </div>
            </div>
            <button type="submit" id="btnLogin" class="btn btn-success w-100 fw-bold py-2 mb-3">Masuk</button>
            <div class="text-center">
                <a href="../index.html" class="text-decoration-none text-muted small"><i class="fa-solid fa-arrow-left me-1"></i> Kembali ke Beranda Publik</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
if(localStorage.getItem('KT_TOKEN')) {
            window.location.replace('index.html');
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btnLogin');
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Memproses...';
            btn.disabled = true;

            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            const res = await postAPI('login', { username: user, password: pass }, false);

            if (res && res.success) {
                
                localStorage.setItem('KT_TOKEN', res.data.token);
                localStorage.setItem('KT_USER', JSON.stringify(res.data.user));
                
                Swal.fire({ icon: 'success', title: 'Berhasil', text: 'Selamat datang, ' + res.data.user.nama, timer: 1500, showConfirmButton: false })
                .then(() => {
                    window.location.replace('index.html');
                });
            } else {
                Swal.fire('Gagal', res ? res.message : 'Koneksi gagal', 'error');
                btn.innerHTML = 'Masuk';
                btn.disabled = false;
            }
        });
</script>
</body>
</html>
