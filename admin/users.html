<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Pengguna - Admin Karang Taruna</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <link href="../assets/css/style.css" rel="stylesheet">
    <link href="../assets/css/admin.css" rel="stylesheet">
</head>
<body>

    <script src="../assets/js/api.js"></script>
    <script src="../assets/js/auth.js"></script>
    <script>
checkAuth();
        checkRole(['ADMIN']);
</script>

    <div class="admin-wrapper">
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">KT Admin Panel</div>
            <ul class="sidebar-menu mt-3">
                <li><a href="index.html"><i class="fa-solid fa-gauge"></i> Dashboard</a></li>
                <li><a href="berita.html"><i class="fa-solid fa-newspaper"></i> Kelola Berita</a></li>
                <li><a href="kegiatan.html"><i class="fa-solid fa-calendar-check"></i> Kelola Kegiatan</a></li>
                <li><a href="arsip.html"><i class="fa-solid fa-folder-open"></i> Arsip Surat</a></li>
                <li><a href="dokumentasi.html"><i class="fa-solid fa-images"></i> Dokumentasi</a></li>
                <li class="px-3 pt-3 pb-1 text-muted small fw-bold text-uppercase">Sistem</li>
                <li><a href="struktur.html"><i class="fa-solid fa-sitemap"></i> Struktur Org</a></li>
                <li><a href="users.html" class="active"><i class="fa-solid fa-users"></i> Kelola Pengguna</a></li>
                <li><a href="settings.html"><i class="fa-solid fa-cog"></i> Pengaturan Web</a></li>
                <li><a href="#" onclick="logout()"><i class="fa-solid fa-right-from-bracket text-danger"></i> <span class="text-danger">Logout</span></a></li>
            </ul>
        </aside>

        <main class="main-content">
            <header class="admin-header">
                <div class="d-flex align-items-center">
                    <button class="btn-toggle-sidebar me-3" id="btnToggleSidebar"><i class="fa-solid fa-bars"></i></button>
                    <h5 class="mb-0 fw-bold text-success">Kelola Pengguna</h5>
                </div>
            </header>

            <div class="admin-body">
                <div id="viewList">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold mb-0">Daftar Akun</h5>
                        <button class="btn btn-success fw-bold" onclick="showForm()"><i class="fa-solid fa-plus me-1"></i> Tambah Akun</button>
                    </div>

                    <div class="card card-custom p-0 border-0 shadow-sm">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>Nama Pengguna</th>
                                        <th>Username</th>
                                        <th>Hak Akses (Role)</th>
                                        <th>Status</th>
                                        <th class="text-end">Aksi</th>
                                    </tr>
                                </thead>
                                <tbody id="tableUserBody">
                                    <tr><td colspan="5" class="text-center py-4">Memuat data...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="viewForm" class="d-none">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h5 class="fw-bold mb-0" id="formTitle">Tambah Akun Baru</h5>
                        <button class="btn btn-outline-secondary fw-bold" onclick="hideForm()"><i class="fa-solid fa-arrow-left me-1"></i> Kembali</button>
                    </div>

                    <div class="card card-custom p-4 border-0 shadow-sm" style="max-width: 600px;">
                        <form id="formUser">
                            <input type="hidden" id="userId">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Nama Lengkap *</label>
                                <input type="text" id="namaUser" class="form-control" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold small">Username *</label>
                                <input type="text" id="username" class="form-control" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold small">Password <span id="passLabel" class="text-muted fw-normal">(Wajib untuk akun baru)</span></label>
                                <input type="password" id="password" class="form-control" placeholder="Biarkan kosong jika tidak ingin mengubah password (saat edit)">
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label fw-bold small">Hak Akses (Role) *</label>
                                    <select id="role" class="form-select">
                                        <option value="USER">USER (Hanya Input)</option>
                                        <option value="ADMIN">ADMIN (Akses Penuh)</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-4">
                                    <label class="form-label fw-bold small">Status *</label>
                                    <select id="statusUser" class="form-select">
                                        <option value="active">Aktif</option>
                                        <option value="inactive">Nonaktif</option>
                                    </select>
                                </div>
                            </div>

                            <button type="submit" class="btn btn-success fw-bold w-100" id="btnSaveUser"><i class="fa-solid fa-save me-1"></i> Simpan Akun</button>
                        </form>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../assets/js/admin-users.js"></script>
</body>
</html>
